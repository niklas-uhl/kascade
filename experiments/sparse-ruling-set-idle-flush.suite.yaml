name: sparse-ruling-set-idle-flush
executable: bench/kascade
output_path_option_name: "output-file"
ncores: [64, 128, 256, 512, 1024, 2048]
time_limit: 2
threads_per_rank: [1]
# tasks_per_node: 64
graphs:
  - generator: kagen
    type: path
    N: 16
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
  - generator: kagen
    type: path
    N: 18
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
  - generator: kagen
    type: path
    N: 20
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
  - generator: kagen
    type: path
    N: 22
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
config:
  # sync baselines
  - algorithm: SparseRulingSet
    sparse-ruling-set-ruler-selection: ultimate-sanders
    sparse-ruling-set-ultimate-sanders-factor: [2.0]
    sparse-ruling-set-spawn: True
    sparse-ruling-set-sync-locality-aware: True
    sparse-ruling-set-ruler-propagation-use-aggregation: [False]
    sparse-ruling-set-reverse-list-locality-aware: [True]
    sparse-ruling-set-post-invert: [True]
    sparse-ruling-set-post-invert-detect-leaves: [False]
    sparse-ruling-set-base-algorithm: [SparseRulingSet]
    sparse-ruling-set-cache-owners: [True]
    sparse-ruling-set-use-local-contraction: [True]
    pointer-doubling-fallback-allgather-size-ratio: [3]
    sparse-ruling-set-use-grid-communication: [False, True]
  # async: briefkasten idle flush off (= current feat/briefkasten-tokens), all (= v0.2.1), stale
  - algorithm: SparseRulingSet
    sparse-ruling-set-ruler-selection: ultimate-sanders
    sparse-ruling-set-ultimate-sanders-factor: [2.0]
    sparse-ruling-set-spawn: True
    sparse-ruling-set-sync-locality-aware: True
    sparse-ruling-set-ruler-propagation-use-aggregation: [False]
    sparse-ruling-set-reverse-list-locality-aware: [True]
    sparse-ruling-set-post-invert: [True]
    sparse-ruling-set-post-invert-detect-leaves: [False]
    sparse-ruling-set-base-algorithm: [SparseRulingSet]
    sparse-ruling-set-cache-owners: [True]
    sparse-ruling-set-use-local-contraction: [True]
    pointer-doubling-fallback-allgather-size-ratio: [3]
    sparse-ruling-set-use-grid-communication: [False, True]
    sparse-ruling-set-async: True
    sparse-ruling-set-briefkasten-idle-flush: ["off", "all", "stale"]  # quoted: bare off is YAML false
    # 1000 was tuned on v0.2.1, whose poll_throttled never polled after the first call;
    # 100 is briefkasten's default and what KaCCv2 runs with
    sparse-ruling-set-briefkasten-poll-skip-threshold: [100, 1000]
