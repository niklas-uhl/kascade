name: sparse-ruling-set-idle-flush-grid
executable: bench/kascade
output_path_option_name: "output-file"
ncores: [64, 128, 256, 512, 1024, 2048]
time_limit: 4  # 2 killed the slowest flat arms at n=2^22, p>=1536 (I_MPI_JOB_TIMEOUT)
threads_per_rank: [1]
# tasks_per_node: 64
graphs:
  - generator: kagen
    type: path
    N: 16
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
  - generator: kagen
    type: path
    N: 18
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
  - generator: kagen
    type: path
    N: 20
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
  - generator: kagen
    type: path
    N: 22
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
config:
  # Grid arms with the rotating idle-flush start. The 26_11_05 grid arms all started every idle flush at the
  # same destinations (= fixed-start here). Flat references: sync and the best flat async arm from
  # sparse-ruling-set-idle-flush-backlog_26_11_05 (all, rotating, backlog 0 = the briefkasten defaults).
  # No backlog sweep: it hurt in every flat cell. String values are quoted (bare `off` is YAML false).
  # sync baselines, flat and grid
  - algorithm: SparseRulingSet
    sparse-ruling-set-ruler-selection: ultimate-sanders
    sparse-ruling-set-ultimate-sanders-factor: [2.0]
    sparse-ruling-set-spawn: True
    sparse-ruling-set-sync-locality-aware: True
    sparse-ruling-set-ruler-propagation-use-aggregation: [False]
    sparse-ruling-set-reverse-list-locality-aware: [True]
    sparse-ruling-set-post-invert: [True]
    sparse-ruling-set-post-invert-detect-leaves: [False]
    sparse-ruling-set-base-algorithm: [SparseRulingSet]
    sparse-ruling-set-cache-owners: [True]
    sparse-ruling-set-use-local-contraction: [True]
    pointer-doubling-fallback-allgather-size-ratio: [3]
    sparse-ruling-set-use-grid-communication: [False, True]
  # async flat reference: idle flush all, rotating start, backlog 0
  - algorithm: SparseRulingSet
    sparse-ruling-set-ruler-selection: ultimate-sanders
    sparse-ruling-set-ultimate-sanders-factor: [2.0]
    sparse-ruling-set-spawn: True
    sparse-ruling-set-sync-locality-aware: True
    sparse-ruling-set-ruler-propagation-use-aggregation: [False]
    sparse-ruling-set-reverse-list-locality-aware: [True]
    sparse-ruling-set-post-invert: [True]
    sparse-ruling-set-post-invert-detect-leaves: [False]
    sparse-ruling-set-base-algorithm: [SparseRulingSet]
    sparse-ruling-set-cache-owners: [True]
    sparse-ruling-set-use-local-contraction: [True]
    pointer-doubling-fallback-allgather-size-ratio: [3]
    sparse-ruling-set-use-grid-communication: [False]
    sparse-ruling-set-async: True
    sparse-ruling-set-briefkasten-idle-flush: ["all"]
  # async grid, idle flush off: the adapter's current default
  - algorithm: SparseRulingSet
    sparse-ruling-set-ruler-selection: ultimate-sanders
    sparse-ruling-set-ultimate-sanders-factor: [2.0]
    sparse-ruling-set-spawn: True
    sparse-ruling-set-sync-locality-aware: True
    sparse-ruling-set-ruler-propagation-use-aggregation: [False]
    sparse-ruling-set-reverse-list-locality-aware: [True]
    sparse-ruling-set-post-invert: [True]
    sparse-ruling-set-post-invert-detect-leaves: [False]
    sparse-ruling-set-base-algorithm: [SparseRulingSet]
    sparse-ruling-set-cache-owners: [True]
    sparse-ruling-set-use-local-contraction: [True]
    pointer-doubling-fallback-allgather-size-ratio: [3]
    sparse-ruling-set-use-grid-communication: [True]
    sparse-ruling-set-async: True
    sparse-ruling-set-briefkasten-idle-flush: ["off"]
  # async grid, idle flush on: mode x start position
  - algorithm: SparseRulingSet
    sparse-ruling-set-ruler-selection: ultimate-sanders
    sparse-ruling-set-ultimate-sanders-factor: [2.0]
    sparse-ruling-set-spawn: True
    sparse-ruling-set-sync-locality-aware: True
    sparse-ruling-set-ruler-propagation-use-aggregation: [False]
    sparse-ruling-set-reverse-list-locality-aware: [True]
    sparse-ruling-set-post-invert: [True]
    sparse-ruling-set-post-invert-detect-leaves: [False]
    sparse-ruling-set-base-algorithm: [SparseRulingSet]
    sparse-ruling-set-cache-owners: [True]
    sparse-ruling-set-use-local-contraction: [True]
    pointer-doubling-fallback-allgather-size-ratio: [3]
    sparse-ruling-set-use-grid-communication: [True]
    sparse-ruling-set-async: True
    sparse-ruling-set-briefkasten-idle-flush: ["all", "stale"]
    sparse-ruling-set-briefkasten-idle-flush-fixed-start: [False, True]
