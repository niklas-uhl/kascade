name: sparse-ruling-set-indirection-stalls
executable: bench/kascade
output_path_option_name: "output-file"
ncores: [64, 128, 256, 512, 1024, 2048]
time_limit: 4  # 2 killed the slowest flat arms at n=2^22, p>=1536 (I_MPI_JOB_TIMEOUT)
threads_per_rank: [1]
# tasks_per_node: 64
graphs:
  - generator: kagen
    type: path
    N: 20
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
  - generator: kagen
    type: path
    N: 22
    permute: True
    extra_args:
      statistics-level: extensive-reduced-output
      input-processing: none
      verify-level: 0
      iterations: 5
    scale_weak: True
config:
  # Why is async chasing with briefkasten grid indirection ~1.8x slower than without at large n
  # (same rulers, sparse-ruling-set-async-indirection)? Read off the new bk_* stall/flow-control
  # counters (send-slot waits, parking for capacity/credit, grants, polls) and test per-send cost
  # with the aggregation threshold: if a bigger buffer closes the gap, per-send overhead or stalls
  # dominate; if not, it's per-record work. p=48 (one node, no network to save) is the clean case;
  # larger p shows whether the picture changes with the network.
  - algorithm: SparseRulingSet
    sparse-ruling-set-sync-locality-aware: True
    sparse-ruling-set-ruler-propagation-use-aggregation: [False]
    sparse-ruling-set-reverse-list-locality-aware: [True]
    sparse-ruling-set-post-invert: [True]
    sparse-ruling-set-post-invert-detect-leaves: [False]
    sparse-ruling-set-base-algorithm: [SparseRulingSet]
    sparse-ruling-set-cache-owners: [True]
    sparse-ruling-set-use-local-contraction: [True]
    pointer-doubling-fallback-allgather-size-ratio: [3]
    sparse-ruling-set-use-grid-communication: True
    sparse-ruling-set-briefkasten-indirection: ["none", "grid"]
    sparse-ruling-set-briefkasten-local-threshold: [2048, 8192, 32768]
    sparse-ruling-set-ruler-selection: ultimate
    sparse-ruling-set-spawn: False
    sparse-ruling-set-ultimate-factor: [1.0, 2.0]
    sparse-ruling-set-async: True
